name: demo-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: demo/functional
    runs-on: [self-hosted, linux, x64, rag-e2e]
    timeout-minutes: 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make doctor
      - run: make setup
      - run: make reset || true
      - name: Run exact client readiness gate
        run: |
          mkdir -p artifacts
          make demo-ready | tee artifacts/demo-ready.txt
          grep -q 'DEMO READY: all real-runtime client scenarios passed' artifacts/demo-ready.txt
      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-readiness
          path: artifacts/
          if-no-files-found: warn
      - if: always()
        run: make local-down || true
