name: demo-validation

on:
  push:
    branches: [fix/self-hosted-ci-isolation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-e2e-runner
  cancel-in-progress: false

jobs:
  demo:
    name: demo/functional
    runs-on: [self-hosted, linux, x64, rag-e2e]
    timeout-minutes: 30
    env:
      APP_ENV: ci
      COMPOSE_PROJECT_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo
      RAG_OPS_NETWORK: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo-net
      FLOCI_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo-floci
      LLAMA_GEN_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo-gen
      LLAMA_EMBED_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo-embed
      LLAMA_RERANK_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-demo-rerank
      FLOCI_HOST_PORT: '14566'
      LLAMA_GEN_HOST_PORT: '18080'
      LLAMA_EMBED_HOST_PORT: '18081'
      LLAMA_RERANK_HOST_PORT: '18082'
      AWS_ENDPOINT_URL: http://localhost:14566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LLM_BASE_URL: http://localhost:18080/v1
      EMBEDDING_BASE_URL: http://localhost:18081/v1
      RERANKER_BASE_URL: http://localhost:18082
      RERANKER_TIMEOUT_SECONDS: '90'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make doctor
      - run: make setup
      - name: Run exact client readiness gate
        run: |
          mkdir -p artifacts
          make demo-ready | tee artifacts/demo-ready.txt
          grep -q 'DEMO READY: all real-runtime client scenarios passed' artifacts/demo-ready.txt
      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-demo-readiness
          path: artifacts/
          if-no-files-found: warn
      - if: always()
        run: make local-down || true
