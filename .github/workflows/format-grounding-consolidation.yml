name: Format grounding consolidation

on:
  push:
    branches:
      - agent/consolidate-grounding-correctness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-grounding-correctness
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - name: Format modified Python
        run: |
          uv run ruff format \
            src/rag_ops_guard/config.py \
            src/rag_ops_guard/app.py \
            src/rag_ops_guard/retrieval/hybrid.py \
            src/rag_ops_guard/agent/grounding.py \
            src/rag_ops_guard/agent/react_agent.py \
            scripts/calibrate_retrieval_admission.py \
            scripts/semantic_gate_smoke.py \
            tests/unit/test_config.py \
            tests/unit/test_grounding_policy.py \
            tests/unit/test_react_safety.py
          rm .github/workflows/format-grounding-consolidation.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format grounding consolidation"
          git push origin HEAD:agent/consolidate-grounding-correctness
