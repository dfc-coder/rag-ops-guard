name: Format unified beta once

on:
  push:
    branches:
      - agent/beta-unified-react-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/beta-unified-react-core
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          version: '0.12.3'
      - run: uv sync --frozen --group dev
      - run: uv run ruff format .
      - name: Commit format and remove one-shot workflow
        run: |
          rm .github/workflows/format-unified-beta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format unified beta"
          git push origin HEAD:agent/beta-unified-react-core
