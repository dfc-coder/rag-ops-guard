name: Diagnose final Ruff lint

on:
  push:
    branches:
      - agent/consolidate-grounding-correctness

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-grounding-correctness
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          uv run ruff check . > /tmp/ruff.log 2>&1
          status=$?
          set -e
          cp /tmp/ruff.log docs/ruff-diagnostic.txt
          printf '\nexit_status=%s\n' "$status" >> docs/ruff-diagnostic.txt
          rm .github/workflows/diagnose-ruff-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: persist Ruff diagnostic"
          git push origin HEAD:agent/consolidate-grounding-correctness
