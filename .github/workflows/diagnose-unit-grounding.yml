name: Diagnose grounding unit failure

on:
  push:
    branches:
      - agent/consolidate-grounding-correctness

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-grounding-correctness
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - name: Capture unit output
        shell: bash
        run: |
          set +e
          uv run pytest tests/unit --cov=src/rag_ops_guard --cov-fail-under=80 --cov-report=term-missing > /tmp/unit.log 2>&1
          status=$?
          set -e
          cp /tmp/unit.log artifacts/unit-diagnostic.log
          printf '\nexit_status=%s\n' "$status" >> artifacts/unit-diagnostic.log
          rm .github/workflows/diagnose-unit-grounding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture unit diagnostic"
          git push origin HEAD:agent/consolidate-grounding-correctness
