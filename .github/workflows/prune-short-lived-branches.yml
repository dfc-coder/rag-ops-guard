name: delete-merged-short-lived-branch

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          encoded=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_BRANCH"], safe=""))')
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
