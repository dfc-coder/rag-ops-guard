name: Apply unified beta CI fixes once

on:
  push:
    branches:
      - agent/beta-unified-react-core

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/beta-unified-react-core
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          version: '0.12.3'
      - run: uv sync --frozen --group dev
      - name: Apply exact fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          conversation = Path('src/rag_ops_guard/agent/conversation.py')
          text = conversation.read_text(encoding='utf-8')
          old = '''                final_messages = [
                    *history,
                    HumanMessage(content=message),
                    AIMessage(content=answer),
                ]
                self._commit_history(thread_id, final_messages)
'''
          new = '''                safety_messages = [
                    *history,
                    HumanMessage(content=message),
                    AIMessage(content=answer),
                ]
                self._commit_history(thread_id, safety_messages)
'''
          if old not in text:
              raise SystemExit('conversation safety snippet not found')
          conversation.write_text(text.replace(old, new, 1), encoding='utf-8')

          models = Path('src/rag_ops_guard/domain/models.py')
          text = models.read_text(encoding='utf-8')
          old = '''        if self.status == QueryStatus.ANSWERED and self.route == "knowledge" and not self.citations:
            raise ValueError("grounded knowledge responses require citations")
'''
          new = '''        if (
            self.status == QueryStatus.ANSWERED
            and self.route in {"knowledge", None}
            and not self.citations
        ):
            raise ValueError("grounded answered responses require citations")
'''
          if old not in text:
              raise SystemExit('QueryResponse citation snippet not found')
          models.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f docs/unified-ci-diagnostic.txt
          rm -f .github/workflows/diagnose-unified-beta.yml
          uv run ruff format src/rag_ops_guard/agent/conversation.py src/rag_ops_guard/domain/models.py
          uv run ruff check src/rag_ops_guard/agent/conversation.py src/rag_ops_guard/domain/models.py
          uv run mypy src/
          uv run pytest tests/unit -q
      - name: Commit fixes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close unified beta CI contract gaps"
          git push origin HEAD:agent/beta-unified-react-core
