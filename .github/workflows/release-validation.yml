name: release-validation

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-e2e-runner
  cancel-in-progress: true

jobs:
  real-e2e:
    name: release/e2e
    runs-on: [self-hosted, linux, x64, rag-e2e]
    timeout-minutes: 60
    env:
      APP_ENV: ci
      RUN_REAL_E2E: '1'
      COMPOSE_PROJECT_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      RAG_OPS_NETWORK: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-net
      FLOCI_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-floci
      LLAMA_GEN_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-gen
      LLAMA_EMBED_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-embed
      LLAMA_RERANK_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e-rerank
      FLOCI_HOST_PORT: '24566'
      LLAMA_GEN_HOST_PORT: '28080'
      LLAMA_EMBED_HOST_PORT: '28081'
      LLAMA_RERANK_HOST_PORT: '28082'
      AWS_ENDPOINT_URL: http://localhost:24566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LLM_BASE_URL: http://localhost:28080/v1
      LLM_MODEL: qwen3-4b-rag
      RAGAS_JUDGE_MODEL: qwen3-4b-rag
      EMBEDDING_BASE_URL: http://localhost:28081/v1
      RERANKER_BASE_URL: http://localhost:28082
      RERANKER_TIMEOUT_SECONDS: '90'
    steps:
      - name: Remove legacy Floci bind-mount data
        run: |
          if [ -e "$GITHUB_WORKSPACE/.local/floci" ]; then
            podman unshare rm -rf "$GITHUB_WORKSPACE/.local/floci"
          fi
      - uses: actions/checkout@v7.0.1
      - run: make doctor
      - run: make setup
      - run: make models
      - run: make local-up
      - run: make local-data
      - run: make retrieval-validate
      - run: make local-provision
      - run: make ingest-corpus
      - run: uv run pytest -m e2e tests/e2e
      - run: uv run pytest tests/adversarial
      - run: make eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta1-evaluation
          path: artifacts/
      - if: always()
        run: make local-clean || true

  reproducibility:
    name: release/reproducibility
    runs-on: [self-hosted, linux, x64, rag-e2e]
    timeout-minutes: 60
    env:
      APP_ENV: ci
      COMPOSE_PROJECT_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro
      RAG_OPS_NETWORK: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro-net
      FLOCI_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro-floci
      LLAMA_GEN_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro-gen
      LLAMA_EMBED_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro-embed
      LLAMA_RERANK_CONTAINER_NAME: rag-ops-ci-${{ github.run_id }}-${{ github.run_attempt }}-repro-rerank
      FLOCI_HOST_PORT: '34566'
      LLAMA_GEN_HOST_PORT: '38080'
      LLAMA_EMBED_HOST_PORT: '38081'
      LLAMA_RERANK_HOST_PORT: '38082'
      AWS_ENDPOINT_URL: http://localhost:34566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LLM_BASE_URL: http://localhost:38080/v1
      LLM_MODEL: qwen3-4b-rag
      RAGAS_JUDGE_MODEL: qwen3-4b-rag
      EMBEDDING_BASE_URL: http://localhost:38081/v1
      RERANKER_BASE_URL: http://localhost:38082
      RERANKER_TIMEOUT_SECONDS: '90'
    steps:
      - name: Remove legacy Floci bind-mount data
        run: |
          if [ -e "$GITHUB_WORKSPACE/.local/floci" ]; then
            podman unshare rm -rf "$GITHUB_WORKSPACE/.local/floci"
          fi
      - uses: actions/checkout@v7.0.1
        with:
          clean: true
      - run: make doctor
      - run: make setup
      - run: make models
      - run: make local-up
      - run: make local-data
      - run: make retrieval-validate
      - run: make local-provision
      - run: make ingest-corpus
      - run: make smoke
      - if: always()
        run: make local-clean || true

  gate:
    name: release/gate
    if: always()
    needs: [real-e2e, reproducibility]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results={k:v['result'] for k,v in json.loads(os.environ['NEEDS_JSON']).items()}
          print(results)
          sys.exit(0 if all(v == 'success' for v in results.values()) else 1)
          PY
