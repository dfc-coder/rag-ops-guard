name: patch-stale-judge-policy

on:
  push:
    branches: [fix/floci-apigw-dataplane]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/floci-apigw-dataplane
      - name: Patch stale policy semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('evaluation/runners/run_ragas.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'def _load_judge_policy(identity: JudgeIdentity) -> JudgePolicy | None:\n',
              'def _load_judge_policy(\n    identity: JudgeIdentity, *, required: bool\n) -> JudgePolicy | None:\n',
              1,
          )
          old = '''    if mismatches:\n        raise SystemExit(\n            "judge calibration is stale for the active evaluator; recalibrate. " + "; ".join(mismatches)\n        )\n'''
          new = '''    if mismatches:\n        message = (\n            "judge calibration is stale for the active evaluator; recalibrate. "\n            + "; ".join(mismatches)\n        )\n        if required:\n            raise SystemExit(message)\n        print(f"RAGAS measurement: {message} Ignoring stale policy.", flush=True)\n        return None\n'''
          if old not in source:
              raise SystemExit('stale policy block not found')
          source = source.replace(old, new, 1)
          old = '''    thresholds = yaml.safe_load(Path("evaluation/thresholds.yaml").read_text())\n    judge = judge_connection_from_env()\n'''
          new = '''    thresholds = yaml.safe_load(Path("evaluation/thresholds.yaml").read_text())\n    judge = judge_connection_from_env()\n    calibration_required = _calibration_required()\n'''
          if old not in source:
              raise SystemExit('main judge block not found')
          source = source.replace(old, new, 1)
          old = '    policy = _load_judge_policy(judge.identity)\n'
          new = '    policy = _load_judge_policy(judge.identity, required=calibration_required)\n'
          if old not in source:
              raise SystemExit('policy load call not found')
          source = source.replace(old, new, 1)
          old = '        policy = require_calibration_policy(policy, required=_calibration_required())\n'
          new = '        policy = require_calibration_policy(policy, required=calibration_required)\n'
          if old not in source:
              raise SystemExit('calibration require call not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/runners/run_ragas.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: allow measurement to replace stale judge policy'
          git push origin HEAD:fix/floci-apigw-dataplane
