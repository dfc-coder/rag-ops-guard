name: scheduled-security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: security/scheduled-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          version: '0.12.3'
          enable-cache: true
      - name: Audit runtime/dev dependencies
        run: |
          uv sync --frozen --group dev
          uv run pip-audit
      - name: Audit eval dependencies with documented exceptions
        run: |
          uv sync --frozen --extra eval --group dev
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-3046
