name: security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: security/repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          version: '0.12.3'
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Reject common secret files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|id_rsa$|id_ed25519$)' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Reject obvious real AWS access keys
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}' -- ':!docs/**' ':!README.md'; then
            echo "Possible AWS access key committed"
            exit 1
          fi
