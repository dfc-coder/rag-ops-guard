name: diagram-design-rewrite

on:
  push:
    branches: [docs/diagram-design-redraw]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Replace legacy diagram blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_block_after(text: str, heading: str, language: str, replacement: str) -> str:
              start = text.index(heading)
              fence = text.index(f"```{language}", start)
              end = text.index("```", fence + len(language) + 3) + 3
              return text[:fence] + replacement + text[end:]

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_block_after(
              readme,
              "## Local-first architecture",
              "mermaid",
              "![RAG Ops Guard local-first architecture](docs/diagrams/architecture.svg)",
          )
          readme = replace_block_after(
              readme,
              "## LangGraph workflow",
              "mermaid",
              "![LangGraph query decision flow](docs/diagrams/langgraph-flow.svg)",
          )
          readme = replace_block_after(
              readme,
              "## CI and release gates",
              "mermaid",
              "![CI and release gates](docs/diagrams/ci-release.svg)",
          )
          readme = readme.replace(
              "- Linux or another Docker-capable environment\n- Docker + Docker Compose",
              "- Linux with rootless Podman\n- Podman + a Compose provider",
          )
          readme_path.write_text(readme)

          arch_path = Path("docs/architecture.md")
          arch = arch_path.read_text()
          arch = replace_block_after(
              arch,
              "## Local architecture",
              "text",
              "![RAG Ops Guard local-first architecture](diagrams/architecture.svg)",
          )
          arch = replace_block_after(
              arch,
              "## Core architectural boundary",
              "text",
              "![Ports and adapters boundary](diagrams/ports-adapters.svg)",
          )
          arch = replace_block_after(
              arch,
              "## Query state machine",
              "text",
              "![LangGraph query decision flow](diagrams/langgraph-flow.svg)",
          )
          arch_path.write_text(arch)
          PY
      - name: Commit documentation rewrite
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/architecture.md
          git commit -m "docs: replace Mermaid and ASCII diagrams with Diagram Design"
          git push
