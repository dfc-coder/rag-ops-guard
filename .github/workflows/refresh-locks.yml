name: refresh-locks

on:
  push:
    branches: [chore/beta1-foundation]

permissions:
  contents: write

jobs:
  lock:
    if: "${{ !contains(github.event.head_commit.message, 'chore: refresh dependency lock') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'
          version: '0.12.3'
          enable-cache: false
      - run: uv lock
      - run: rm .github/workflows/refresh-locks.yml
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/refresh-locks.yml
          git commit -m "chore: refresh dependency lock"
          git push
