name: patch-ragas-question

on:
  push:
    branches: [fix/floci-apigw-dataplane]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/floci-apigw-dataplane
      - name: Patch evaluator question selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('evaluation/runners/run_ragas.py')
          source = path.read_text(encoding='utf-8')
          old = 'user_input=str(row.get("question") or ""),'
          new = 'user_input=str(row.get("ragas_question") or row.get("question") or ""),'
          if new in source:
              print('patch already applied')
          elif old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('expected evaluator line not found')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/runners/run_ragas.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: score mixed RAGAS against grounded subquestion'
          git push origin HEAD:fix/floci-apigw-dataplane
