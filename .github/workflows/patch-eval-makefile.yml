name: patch-eval-makefile

on:
  push:
    branches: [fix/floci-apigw-dataplane]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/floci-apigw-dataplane
      - name: Wire one-command measurement and human review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Makefile')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'RAGAS_MAX_WORKERS ?= 2\nLAMBDA_PYTHON_VERSION ?= 3.12',
                  'RAGAS_MAX_WORKERS ?= 2\nRAGAS_SUITE_TIMEOUT_SECONDS ?= 1800\nLAMBDA_PYTHON_VERSION ?= 3.12',
              ),
              (
                  'RAGAS_MAX_RETRIES RAGAS_MAX_WAIT_SECONDS RAGAS_MAX_WORKERS LAMBDA_PYTHON_VERSION',
                  'RAGAS_MAX_RETRIES RAGAS_MAX_WAIT_SECONDS RAGAS_MAX_WORKERS RAGAS_SUITE_TIMEOUT_SECONDS LAMBDA_PYTHON_VERSION',
              ),
              (
                  'eval eval-measure eval-judge-calibrate eval-langsmith release-check reset',
                  'eval eval-measure eval-human-review eval-judge-calibrate eval-langsmith release-check reset',
              ),
              (
                  '\t@set -a; source .local/relevance-floors.env; set +a; $(OPENVINO_BACKEND_ENV) RAGAS_REQUIRE_CALIBRATION=0 uv run --extra eval python evaluation/runners/run_ragas.py\n\nphysical-eval:',
                  '\t@set -a; source .local/relevance-floors.env; set +a; $(OPENVINO_BACKEND_ENV) RAGAS_REQUIRE_CALIBRATION=0 uv run --extra eval python evaluation/runners/run_ragas.py\n\t@set -a; source .local/relevance-floors.env; set +a; $(OPENVINO_BACKEND_ENV) uv run --extra eval python scripts/prepare_judge_human_review.py\n\nphysical-eval:',
              ),
              (
                  'eval-judge-calibrate:\n\tuv run --extra eval python scripts/calibrate_ragas_judge.py',
                  'eval-human-review:\n\tuv run --extra eval python scripts/prepare_judge_human_review.py\n\neval-judge-calibrate:\n\tuv run --extra eval python scripts/calibrate_ragas_judge.py',
              ),
          ]
          for old, new in replacements:
              if new in source:
                  continue
              if old not in source:
                  raise SystemExit(f'expected Makefile fragment missing: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit Makefile wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: make physical measurement produce human review package'
          git push origin HEAD:fix/floci-apigw-dataplane
