name: refresh-cdklocal-lock-pr

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/python313-cdk-canonical-infra' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/python313-cdk-canonical-infra
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Pin aws-cdk-local beside aws-cdk
        working-directory: infra/cdk
        run: npm install --save-dev --package-lock-only aws-cdk-local@3.0.4
      - name: Commit deterministic local CDK tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/cdk/package.json infra/cdk/package-lock.json
          git commit -m 'build: pin cdklocal with the CDK CLI'
          git push origin HEAD:chore/python313-cdk-canonical-infra
