name: refresh-cdklocal-lock-pr

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/python313-cdk-canonical-infra' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/python313-cdk-canonical-infra
      - name: Use repository-local cdklocal from locked node_modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Makefile')
          text = path.read_text()
          text = text.replace(
              'CDK_LOCAL ?= npx --yes --package aws-cdk-local@3.0.4 --package aws-cdk@2.1133.0 cdklocal',
              'CDK_LOCAL ?= npx cdklocal',
          )
          path.write_text(text)
          PY
      - name: Commit local CDK command
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile
          git commit -m 'build: use repository-local cdklocal'
          git push origin HEAD:chore/python313-cdk-canonical-infra
