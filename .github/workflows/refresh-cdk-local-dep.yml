name: refresh-cdk-local-dep

on:
  push:
    branches: [chore/python313-cdk-canonical-infra]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/python313-cdk-canonical-infra
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Pin aws-cdk-local beside the CDK CLI
        working-directory: infra/cdk
        run: npm install --save-dev --package-lock-only aws-cdk-local@3.0.4
      - name: Use the repository-local cdklocal executable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path('Makefile')
          text = makefile.read_text()
          text = text.replace(
              'CDK_LOCAL ?= npx --yes --package aws-cdk-local@3.0.4 cdklocal',
              'CDK_LOCAL ?= npx cdklocal',
          )
          makefile.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          text = text.replace(
              'npx --yes --package aws-cdk-local@3.0.4 cdklocal bootstrap',
              'npx cdklocal bootstrap',
          ).replace(
              'npx --yes --package aws-cdk-local@3.0.4 cdklocal deploy',
              'npx cdklocal deploy',
          )
          ci.write_text(text)
          PY
      - name: Commit deterministic local CDK tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile .github/workflows/ci.yml infra/cdk/package.json infra/cdk/package-lock.json
          git commit -m 'build: pin local CDK adapter beside CDK CLI'
          git push origin HEAD:chore/python313-cdk-canonical-infra
