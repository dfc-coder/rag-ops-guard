name: ${COMPOSE_PROJECT_NAME:-rag-ops-guard}

services:
  floci:
    image: docker.io/floci/floci:1.6.0
    container_name: ${FLOCI_CONTAINER_NAME:-rag-ops-floci}
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4566}:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: ${RAG_OPS_NETWORK:-rag-ops-net}
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: ${RAG_OPS_NETWORK:-rag-ops-net}
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: floci
      FLOCI_DNS_CONTAINER_FALLBACK_ENABLED: "false"
    volumes:
      - floci-data:/app/data
      - "${PODMAN_SOCKET}:/var/run/docker.sock:z"
    networks:
      - rag-ops-net

  llama-gen:
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    container_name: ${LLAMA_GEN_CONTAINER_NAME:-rag-ops-llama-gen}
    command:
      - -m
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --alias
      - qwen3-4b-rag
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-8192}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --cache-prompt
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "1.5"
      - --repeat-penalty
      - "1.0"
      - --reasoning
      - "off"
      - --jinja
      - --metrics
    ports:
      - "127.0.0.1:${LLAMA_GEN_HOST_PORT:-8080}:8080"
    volumes:
      - "${MODEL_DIR:-../.models}:/models:ro"
    networks:
      - rag-ops-net

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    container_name: ${LLAMA_EMBED_CONTAINER_NAME:-rag-ops-llama-embed}
    command:
      - -m
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --alias
      - qwen3-embedding-0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --embedding
      - --pooling
      - last
      - --metrics
    ports:
      - "127.0.0.1:${LLAMA_EMBED_HOST_PORT:-8081}:8081"
    volumes:
      - "${MODEL_DIR:-../.models}:/models:ro"
    networks:
      - rag-ops-net

  llama-rerank:
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    container_name: ${LLAMA_RERANK_CONTAINER_NAME:-rag-ops-llama-rerank}
    command:
      - -m
      - /models/Qwen3-Reranker-0.6B-Q4_K_M.gguf
      - --alias
      - qwen3-reranker-0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --embedding
      - --reranking
      - --pooling
      - rank
      - --metrics
    ports:
      - "127.0.0.1:${LLAMA_RERANK_HOST_PORT:-8082}:8082"
    volumes:
      - "${MODEL_DIR:-../.models}:/models:ro"
    networks:
      - rag-ops-net

networks:
  rag-ops-net:
    name: ${RAG_OPS_NETWORK:-rag-ops-net}

volumes:
  floci-data:
