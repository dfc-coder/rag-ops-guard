services:
  llama-gen:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GROUP_ID}"
    environment:
      ONEAPI_DEVICE_SELECTOR: "level_zero:*"
    command:
      - -m
      - /models/Qwen3.5-2B-Q4_K_M.gguf
      - --alias
      - qwen35-2b-rag
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - "8"
      - --threads-batch
      - "8"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-8192}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --n-gpu-layers
      - "${SYCL_GPU_LAYERS:-99}"
      - --cache-prompt
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "1.5"
      - --repeat-penalty
      - "1.0"
      - --reasoning
      - "off"
      - --jinja
      - --metrics
