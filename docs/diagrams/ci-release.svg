<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="ttl dsc"><title id="ttl">CI + release gates</title><desc id="dsc">Feature work enters GitHub-hosted deterministic CI, then trusted develop pushes run real local model validation before main and beta tag.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596579"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3E6B8E"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#E46F44"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#262B35" opacity="0.065"/></pattern></defs><style>.title{font-family:Georgia,'Times New Roman',serif;font-size:28px;fill:#262B35}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;letter-spacing:2px;fill:#596579}.name{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:600;fill:#262B35}.sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:#596579}.tiny{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7px;fill:#8A94A5;letter-spacing:1px}.aside{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic;fill:#596579}.lane{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:600;letter-spacing:1.2px;fill:#596579}</style><rect width="100%" height="100%" fill="#F6F6F3"/><rect width="100%" height="100%" fill="url(#dots)" opacity="0.35"/><text x="40" y="34" class="eyebrow">PROCESS · DIAGRAM DESIGN</text><text x="40" y="66" class="title">CI + release gates</text><rect x="135" y="120" width="1005" height="90" fill="#262B35" opacity="0.018"/><line x1="40" y1="120" x2="1140" y2="120" stroke="#D6D9DE"/><text x="75" y="169" class="lane" text-anchor="middle">DEVELOPER</text><line x1="40" y1="220" x2="1140" y2="220" stroke="#D6D9DE"/><text x="75" y="269" class="lane" text-anchor="middle">GITHUB HOSTED</text><rect x="135" y="340" width="1005" height="90" fill="#262B35" opacity="0.018"/><line x1="40" y1="340" x2="1140" y2="340" stroke="#D6D9DE"/><text x="75" y="389" class="lane" text-anchor="middle">TRUSTED RUNNER</text><line x1="40" y1="470" x2="1140" y2="470" stroke="#D6D9DE"/><text x="75" y="519" class="lane" text-anchor="middle">RELEASE</text><line x1="135" y1="120" x2="135" y2="560" stroke="#D6D9DE"/><line x1="250" y1="165" x2="330" y2="165" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M410 165H455Q463 165 463 173V258" fill="none" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M575 265H635Q643 265 643 257V190" fill="none" stroke="#E46F44" stroke-width="1.4" marker-end="url(#arrow-accent)"/><path d="M715 165H770Q778 165 778 173V378" fill="none" stroke="#3E6B8E" stroke-width="1.2" marker-end="url(#arrow-link)"/><line x1="870" y1="385" x2="930" y2="385" stroke="#E46F44" stroke-width="1.4" marker-end="url(#arrow-accent)"/><path d="M1000 405V500Q1000 508 1008 508H1025" fill="none" stroke="#E46F44" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="165" y="135" width="85" height="60" rx="7" fill="#F0F2F4" stroke="#8A94A5"/><text x="207.5" y="166" class="name" text-anchor="middle">Change</text><text x="207.5" y="183" class="sub" text-anchor="middle">feature/fix/docs</text><rect x="330" y="135" width="80" height="60" rx="7" fill="#FFF" stroke="#262B35"/><text x="370" y="166" class="name" text-anchor="middle">PR</text><text x="370" y="183" class="sub" text-anchor="middle">→ develop</text><rect x="430" y="235" width="145" height="60" rx="7" fill="#FCEBE4" stroke="#E46F44"/><text x="502.5" y="266" class="name" text-anchor="middle">ci/gate</text><text x="502.5" y="283" class="sub" text-anchor="middle">quality · unit · property</text><text x="502" y="314" class="sub" text-anchor="middle">security · Floci · CDK</text><rect x="635" y="135" width="80" height="60" rx="7" fill="#FFF" stroke="#262B35"/><text x="675" y="166" class="name" text-anchor="middle">develop</text><text x="675" y="183" class="sub" text-anchor="middle">trusted merge</text><rect x="735" y="355" width="135" height="60" rx="7" fill="#FFF" stroke="#262B35"/><text x="802.5" y="386" class="name" text-anchor="middle">release validation</text><text x="802.5" y="403" class="sub" text-anchor="middle">Qwen · Floci · E2E</text><text x="802" y="433" class="sub" text-anchor="middle">adversarial · golden · RAGAS · repro</text><rect x="930" y="355" width="140" height="60" rx="7" fill="#FCEBE4" stroke="#E46F44"/><text x="1000" y="386" class="name" text-anchor="middle">release/gate</text><text x="1000" y="403" class="sub" text-anchor="middle">binary blockers</text><rect x="1025" y="478" width="100" height="60" rx="7" fill="#FFF" stroke="#262B35"/><text x="1075" y="509" class="name" text-anchor="middle">main</text><text x="1075" y="526" class="sub" text-anchor="middle">v0.1.0-beta.1</text><rect x="170" y="245" width="205" height="52" rx="6" fill="#FFF" stroke="#D6D9DE"/><text x="185" y="264" class="tiny">PR POLICY</text><text x="185" y="283" class="sub">self-hosted never runs pull_request</text><rect x="155" y="355" width="330" height="78" rx="6" fill="#FFF" stroke="#D6D9DE"/><text x="170" y="375" class="tiny">TRUST BOUNDARY</text><text x="170" y="396" class="name">dakota-fedora-rag-e2e</text><text x="170" y="414" class="sub">self-hosted · linux · x64 · rag-e2e</text><line x1="40" y1="585" x2="1140" y2="585" stroke="#D6D9DE"/><text x="40" y="612" class="aside">Deterministic CI proves code contracts; the trusted runner proves the real local AI system.</text></svg>