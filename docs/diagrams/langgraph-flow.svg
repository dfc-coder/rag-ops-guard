<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" role="img" aria-labelledby="ttl dsc"><title id="ttl">LangGraph · query decision flow</title><desc id="dsc">A request is validated, analyzed for policy and ambiguity, then evidence is retrieved and resolved before generation. Non-answer paths exit safely.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596579"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#E46F44"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#262B35" opacity="0.065"/></pattern></defs><style>.title{font-family:Georgia,'Times New Roman',serif;font-size:28px;fill:#262B35}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;letter-spacing:2px;fill:#596579}.name{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:600;fill:#262B35}.sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:#596579}.tiny{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7px;fill:#8A94A5;letter-spacing:1px}.label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;fill:#596579}.aside{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic;fill:#596579}</style><rect width="100%" height="100%" fill="#F6F6F3"/><rect width="100%" height="100%" fill="url(#dots)" opacity="0.35"/><text x="40" y="34" class="eyebrow">FLOWCHART · DIAGRAM DESIGN</text><text x="40" y="66" class="title">LangGraph · query decision flow</text><line x1="500" y1="132" x2="500" y2="165" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="223" x2="500" y2="255" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="313" x2="500" y2="333" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="387" x2="500" y2="430" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="488" x2="500" y2="515" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="569" x2="500" y2="610" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="668" x2="500" y2="705" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="763" x2="500" y2="785" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M455 360H270Q262 360 262 368V430" fill="none" stroke="#596579" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><path d="M545 360H735Q743 360 743 368V430" fill="none" stroke="#596579" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><path d="M455 542H270Q262 542 262 550V610" fill="none" stroke="#596579" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><path d="M455 812H270Q262 812 262 820V842" fill="none" stroke="#596579" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><path d="M545 812H785" fill="none" stroke="#E46F44" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="425" y="100" width="150" height="32" rx="16" fill="#FFF" stroke="#262B35"/><text x="500" y="121" class="name" text-anchor="middle">START</text><rect x="390" y="165" width="220" height="58" rx="7" fill="#FFF" stroke="#262B35"/><text x="500" y="195" class="name" text-anchor="middle">Validate request</text><text x="500" y="212" class="sub" text-anchor="middle">schema · length · sanity</text><rect x="390" y="255" width="220" height="58" rx="7" fill="#FFF" stroke="#262B35"/><text x="500" y="285" class="name" text-anchor="middle">Analyze query</text><text x="500" y="302" class="sub" text-anchor="middle">intent · ambiguity · safety</text><polygon points="500,333 565,360 500,387 435,360" fill="#FCEBE4" stroke="#E46F44"/><text x="500" y="358" class="name" text-anchor="middle">Route?</text><text x="500" y="374" class="sub" text-anchor="middle">policy / ambiguity</text><rect x="180" y="430" width="165" height="58" rx="7" fill="#F0F2F4" stroke="#8A94A5"/><text x="262.5" y="460" class="name" text-anchor="middle">safety_blocked</text><text x="262.5" y="477" class="sub" text-anchor="middle">policy bypass</text><rect x="665" y="430" width="170" height="58" rx="7" fill="#F0F2F4" stroke="#8A94A5"/><text x="750" y="460" class="name" text-anchor="middle">clarification_required</text><text x="750" y="477" class="sub" text-anchor="middle">system · env · version</text><rect x="390" y="430" width="220" height="58" rx="7" fill="#FFF" stroke="#262B35"/><text x="500" y="460" class="name" text-anchor="middle">Retrieve evidence</text><text x="500" y="477" class="sub" text-anchor="middle">embed · S3 Vectors top-k</text><polygon points="500,515 565,542 500,569 435,542" fill="#FFF" stroke="#262B35"/><text x="500" y="540" class="name" text-anchor="middle">Evidence?</text><text x="500" y="556" class="sub" text-anchor="middle">admissible + current</text><rect x="175" y="610" width="175" height="58" rx="7" fill="#F0F2F4" stroke="#8A94A5"/><text x="262.5" y="640" class="name" text-anchor="middle">insufficient_evidence</text><text x="262.5" y="657" class="sub" text-anchor="middle">missing · conflict</text><rect x="390" y="610" width="220" height="58" rx="7" fill="#FFF" stroke="#262B35"/><text x="500" y="640" class="name" text-anchor="middle">Generate grounded answer</text><text x="500" y="657" class="sub" text-anchor="middle">Qwen3-4B · admitted context</text><rect x="390" y="705" width="220" height="58" rx="7" fill="#FCEBE4" stroke="#E46F44"/><text x="500" y="735" class="name" text-anchor="middle">Validate citations</text><text x="500" y="752" class="sub" text-anchor="middle">IDs ∈ resolved evidence</text><polygon points="500,785 565,812 500,839 435,812" fill="#FFF" stroke="#262B35"/><text x="500" y="810" class="name" text-anchor="middle">Valid?</text><text x="500" y="826" class="sub" text-anchor="middle">citation contract</text><rect x="175" y="842" width="175" height="42" rx="7" fill="#F0F2F4" stroke="#8A94A5"/><text x="262.5" y="864" class="name" text-anchor="middle">insufficient_evidence</text><text x="262.5" y="881" class="sub" text-anchor="middle">safe abstention</text><rect x="785" y="790" width="180" height="44" rx="22" fill="#FCEBE4" stroke="#E46F44"/><text x="875" y="809" class="name" text-anchor="middle">answered</text><text x="875" y="824" class="sub" text-anchor="middle">answer + citations</text><text x="335" y="351" class="label" text-anchor="middle">unsafe</text><text x="665" y="351" class="label" text-anchor="middle">ambiguous</text><text x="512" y="408" class="label" text-anchor="middle">continue</text><text x="322" y="533" class="label" text-anchor="middle">no</text><text x="512" y="592" class="label" text-anchor="middle">yes</text><text x="322" y="803" class="label" text-anchor="middle">no</text><text x="655" y="803" class="label" text-anchor="middle">yes</text><line x1="40" y1="930" x2="145" y2="930" stroke="#D6D9DE"/><text x="40" y="948" class="aside">Every failure mode terminates in a named public state — never an improvised answer.</text></svg>