<title id="ttl">RAG Ops Guard · local-first architecture</title><desc id="dsc">Client request enters a Floci AWS-compatible plane, is orchestrated by the RAG core, retrieves S3 evidence and uses local Qwen models. Ingestion is a separate lower path.</desc><defs>
