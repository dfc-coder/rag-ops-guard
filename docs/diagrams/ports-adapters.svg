<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="ttl dsc"><title id="ttl">Ports + adapters boundary</title><desc id="dsc">The domain depends on abstract ports. Local implementations bind model and storage services behind those ports.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#596579"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#262B35" opacity="0.065"/></pattern></defs><style>.title{font-family:Georgia,'Times New Roman',serif;font-size:28px;fill:#262B35}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;letter-spacing:2px;fill:#596579}.name{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:600;fill:#262B35}.sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;fill:#596579}.tiny{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:7px;fill:#8A94A5;letter-spacing:1px}.label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;fill:#596579}.aside{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic;fill:#596579}</style><rect width="100%" height="100%" fill="#F6F6F3"/><rect width="100%" height="100%" fill="url(#dots)" opacity="0.35"/><text x="40" y="34" class="eyebrow">LAYER STACK · DIAGRAM DESIGN</text><text x="40" y="66" class="title">Ports + adapters boundary</text><rect x="120" y="115" width="760" height="58" fill="#FFF" stroke="#D6D9DE"/><text x="145" y="149" class="tiny">L1</text><text x="205" y="149" class="name">Domain policy</text><text x="845" y="149" class="sub" text-anchor="end">evidence rules · statuses · contracts</text><rect x="120" y="180" width="760" height="58" fill="#FCEBE4" stroke="#E46F44" stroke-width="1.2"/><text x="145" y="214" class="tiny">L2</text><text x="205" y="214" class="name">Ports</text><text x="845" y="214" class="sub" text-anchor="end">ChatModel · EmbeddingProvider · VectorStore · ObjectStore</text><rect x="120" y="245" width="760" height="58" fill="#FFF" stroke="#D6D9DE"/><text x="145" y="279" class="tiny">L3</text><text x="205" y="279" class="name">Local adapters</text><text x="845" y="279" class="sub" text-anchor="end">llama.cpp chat · embeddings · S3 Vectors · S3</text><rect x="120" y="310" width="760" height="58" fill="#F1F2F3" stroke="#D6D9DE"/><text x="145" y="344" class="tiny">L4</text><text x="205" y="344" class="name">Runtime</text><text x="845" y="344" class="sub" text-anchor="end">Floci + Qwen local inference · rootless Podman</text><path d="M94 332V150" fill="none" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/><text x="68" y="240" class="label" transform="rotate(-90 68 240)" text-anchor="middle">DEPENDENCY INWARD</text><line x1="40" y1="400" x2="960" y2="400" stroke="#D6D9DE"/><text x="40" y="430" class="aside">The migration seam is deliberate: future adapters can change without rewriting domain policy.</text></svg>